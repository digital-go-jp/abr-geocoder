name: CodeQL

on:
  push:
    branches: [main, v3-beta]
  pull_request:
    branches: [main, v3-beta]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
      - name: Build all Go modules
        run: |
          set -e
          for mod in abrg abrdb common; do
            echo "::group::Building $mod"
            (cd "$mod" && go build ./...)
            echo "::endgroup::"
          done
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"
