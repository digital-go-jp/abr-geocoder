name: bench

on:
  pull_request:
    paths:
      - 'abrg/**'
      - 'common/**'
      - 'quickstart/tokyo_basic.duckdb'

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  match-throughput:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          path: pr
      - name: Checkout base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            pr/abrg/go.sum
            base/abrg/go.sum
      - name: Build PR binary
        run: cd pr/abrg && make build && cp abrg "$RUNNER_TEMP/abrg_pr"
      - name: Build base binary
        run: cd base/abrg && make build && cp abrg "$RUNNER_TEMP/abrg_base"
      # Same runner and same input, and each binary reads the cache fixture from
      # its own checkout so a cache schema change does not shut the base binary
      # out. Hardware speed cancels out, so a >15% rise in per-record
      # duration_ms is code.
      - name: Compare per-record cost (base vs PR)
        env:
          BASE_CACHE: ${{ github.workspace }}/base/quickstart/tokyo_basic.duckdb
        run: bash pr/abrg/testdata/bench/ci-compare.sh "$RUNNER_TEMP/abrg_base" "$RUNNER_TEMP/abrg_pr"
