name: abrg-quickstart

services:
  api:
    build:
      context: ..
      dockerfile: abrg/Dockerfile
    container_name: abrg-quickstart
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      GIN_MODE: release
      LOG_LEVEL: info
      CACHE_PATH: /app/tokyo_basic.duckdb
    volumes:
      - ./tokyo_basic.duckdb:/app/tokyo_basic.duckdb
    restart: unless-stopped
