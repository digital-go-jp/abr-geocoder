name: abrg-quickstart

services:
  api:
    build:
      context: ..
      dockerfile: abrg/Dockerfile
      target: dev
    container_name: abrg-quickstart
    ports:
      - "3001:3000"
    environment:
      ABRG_HTTP_PORT: 3000
      LOG_LEVEL: info
      ABRG_CACHE_PATH: /app/tokyo_basic.duckdb
    volumes:
      - ./tokyo_basic.duckdb:/app/tokyo_basic.duckdb
    restart: unless-stopped
