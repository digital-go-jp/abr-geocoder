name: abr
services:
  postgres:
    image: postgres:17
    container_name: abrdb_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h 127.0.0.1"]
      interval: 10s
      retries: 5
      start_period: 30s
    ports:
      - "5432:5432"

  abrdb_app:
    profiles: ["cli"]
    build:
      context: ..
      dockerfile: abrdb/Dockerfile
    container_name: abrdb_cli
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database configuration (environment-specific)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE}
      # Sync configuration (optional)
      ABRDB_DOWNLOAD_DIR: ${ABRDB_DOWNLOAD_DIR:-${HOME}/.abrdb/data}
      # Init configuration (optional)
      ABRDB_PREF: ${ABRDB_PREF:-all}
      ABRDB_CATEGORY: ${ABRDB_CATEGORY:-basic}
      ABRDB_POS: ${ABRDB_POS:-false}
      # Logging (set to debug for verbose output)
      LOG_LEVEL: ${LOG_LEVEL}
    working_dir: /app
