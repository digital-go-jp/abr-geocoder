# DuckDB Cache Schema for abrg geocoder
version: 4

tables:
  cache_machiaza:
    description: "Town/machiaza-level address data"
    columns:
      - name: pref_code
        type: SMALLINT
      - name: lg_code
        type: CHAR(6)
      - name: machiaza_id
        type: CHAR(7)
      - name: rsdt_addr_flg
        type: SMALLINT
      - name: pref
        type: VARCHAR
      - name: county
        type: VARCHAR
      - name: city
        type: VARCHAR
      - name: ward
        type: VARCHAR
      - name: kyoto_st
        type: VARCHAR
      - name: oaza_cho
        type: VARCHAR
      - name: chome
        type: VARCHAR
      - name: koaza
        type: VARCHAR
      - name: machiaza_dist
        type: VARCHAR
      - name: wake_num_flg
        type: SMALLINT
      - name: normalized_address
        type: VARCHAR
      - name: has_chome
        type: BOOLEAN
        default: "FALSE"
      - name: parcel_count
        type: INTEGER
        default: "0"
      - name: rsdtdsp_count
        type: INTEGER
        default: "0"
      - name: lon
        type: FLOAT
      - name: lat
        type: FLOAT
    indexes:
      - name: idx_machiaza_normalized
        columns: [normalized_address]

  cache_city:
    description: "City-level address data"
    columns:
      - name: pref_code
        type: SMALLINT
      - name: lg_code
        type: CHAR(6)
      - name: pref
        type: VARCHAR
      - name: county
        type: VARCHAR
      - name: city
        type: VARCHAR
      - name: ward
        type: VARCHAR
      - name: normalized_address
        type: VARCHAR
      - name: lon
        type: FLOAT
      - name: lat
        type: FLOAT

  cache_pref:
    description: "Prefecture-level address data"
    columns:
      - name: pref_code
        type: SMALLINT
      - name: lg_code
        type: CHAR(6)
      - name: pref
        type: VARCHAR
      - name: normalized_address
        type: VARCHAR
      - name: lon
        type: FLOAT
      - name: lat
        type: FLOAT

  # cache_rsdtdsp and cache_parcel are not declared here: they exist only in
  # caches whose enabled_category includes them, and are created at build time
  # by the CTAS statements in cache/sql.go.

  cache_config:
    description: "Cache metadata and configuration"
    columns:
      - name: config_key
        type: VARCHAR
        constraints: "PRIMARY KEY"
      - name: config_value
        type: VARCHAR
