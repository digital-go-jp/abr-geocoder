version: "2"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - noctx
    - errorlint
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*archive/zip.ReadCloser).Close
        - (io.ReadCloser).Close
  exclusions:
    rules:
      - path: _test\.go
        text: 'Error return value of `os\.(Setenv|Unsetenv)` is not checked'
        linters:
          - errcheck
